name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise install && pnpm install

      - name: Ensure changesets were consumed
        run: |
          if find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            echo "Pending changeset files exist. Merge the release PR before publishing."
            find .changeset -type f -name '*.md' -print
            exit 1
          fi

      - name: Release
        run: pnpm run release
