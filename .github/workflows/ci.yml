name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise install && pnpm install

      - name: Configure Git
        run: |
          git config --global user.name "@ayulab/oh-my-pi"
          git config --global user.email "noreply@example.com"

      - name: Check Changesets status
        run: pnpm changeset status --verbose

      - name: Run CI gate
        run: pnpm run verify
